server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The api decides how large an upload may be (`MAX_UPLOAD_BYTES`, 100 MB,
    # answered as a JSON 413 by its own request fence). Without this line nginx's
    # 1 MB default answered first, with an HTML 413 the api never saw - every
    # reference image over a megabyte failed here (production, 2026-09-06).
    # Matches the api's limit; the host nginx in front allows 128m.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A director turn, a brief approval and a screenplay draft answer only
        # when the model does, and the api waits up to
        # PROVIDER_HTTP_TIMEOUT_SECONDS (120 s) for it; a multipart upload of a
        # large video is decoded and pushed to object storage before it answers.
        # nginx's default proxy_read_timeout is 60 s of upstream silence, so the
        # slow half of those requests was cut off here with a 504 while the api
        # went on to commit the turn the user then saw fail (2026-09-06 audit
        # F12). The host nginx in front must allow at least as long.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

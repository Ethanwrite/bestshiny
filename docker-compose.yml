# Production-oriented local stack. Alibaba OSS is the only durable media plane;
# /data/media is a disposable processing cache shared by API and worker.
x-platform-runtime: &platform-runtime
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://video_platform:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/video_platform
    STORAGE_ROOT: /data/media
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Configure Alibaba OSS endpoint}
    S3_REGION: ${S3_REGION:?Configure Alibaba OSS region}
    S3_BUCKET: ${S3_BUCKET:?Configure Alibaba OSS bucket}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure OSS AccessKey ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure OSS AccessKey Secret}
    S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
    S3_ENFORCE_UPLOAD_CHECKSUM: ${S3_ENFORCE_UPLOAD_CHECKSUM:-true}
    S3_VERIFY_UPLOAD_SHA256_ON_COMPLETE: ${S3_VERIFY_UPLOAD_SHA256_ON_COMPLETE:-true}
    LOCAL_REFERENCE_SIGNING_KEY: ""
    DEPLOYMENT_ENVIRONMENT: production
    AUTH_REQUIRED: "true"
  volumes:
    - media_cache:/data/media
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    # Published so host-side development and the PostgreSQL half of the test
    # matrix reach the same engine the API container uses. Nothing in the
    # compose network needs it; it exists for `alembic` and `pytest` run from
    # a host virtualenv.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: video_platform
      POSTGRES_USER: video_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_platform -d video_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *platform-runtime
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn video_platform_api.main:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *platform-runtime
    build: .
    depends_on:
      api:
        condition: service_healthy
    command: ["video-platform-worker"]

volumes:
  postgres_data:
  media_cache:

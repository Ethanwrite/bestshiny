server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The api decides how large an upload may be (`MAX_UPLOAD_BYTES`, 100 MB,
    # answered as a JSON 413 by its own request fence). Without this line nginx's
    # 1 MB default answered first, with an HTML 413 the api never saw - every
    # reference image over a megabyte failed here (production, 2026-09-06).
    # Matches the api's limit; the host nginx in front allows 128m.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

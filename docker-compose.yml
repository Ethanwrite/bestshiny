services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: video_platform
      POSTGRES_USER: video_platform
      POSTGRES_PASSWORD: video_platform_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_platform -d video_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ai_director
      MINIO_ROOT_PASSWORD: ai_director_dev_secret
    volumes:
      - object_storage_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://object-storage:9000 ai_director ai_director_dev_secret && mc mb --ignore-existing local/ai-director-media"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://video_platform:video_platform_dev@postgres:5432/video_platform
      STORAGE_ROOT: /data/media
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: ai-director-media
      S3_ACCESS_KEY_ID: ai_director
      S3_SECRET_ACCESS_KEY: ai_director_dev_secret
      PUBLIC_BASE_URL: http://localhost:8080
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Generate and export a Fernet key before starting Compose}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?Generate and export a separate internal service key before starting Compose}
      ALCHEMY_WEBHOOK_SIGNING_KEY: ${ALCHEMY_WEBHOOK_SIGNING_KEY:-}
      ALCHEMY_WEBHOOK_ID: ${ALCHEMY_WEBHOOK_ID:-}
      ALCHEMY_NETWORK: ${ALCHEMY_NETWORK:-BASE_MAINNET}
      ALCHEMY_TREASURY_ADDRESS: ${ALCHEMY_TREASURY_ADDRESS:-}
      ALCHEMY_CREDITING_ENABLED: ${ALCHEMY_CREDITING_ENABLED:-false}
      ALCHEMY_USDC_MICROUNITS_PER_CREDIT: ${ALCHEMY_USDC_MICROUNITS_PER_CREDIT:-10000}
      LEGACY_WALLET_PAYMENTS_ENABLED: ${LEGACY_WALLET_PAYMENTS_ENABLED:-false}
      DEPAY_PAYMENT_LINK_URL: ${DEPAY_PAYMENT_LINK_URL:-https://link.depay.com/4zFGRudwFRgMnZWD8bBwPF}
      DEPAY_LINK_ID: ${DEPAY_LINK_ID:-4zFGRudwFRgMnZWD8bBwPF}
      DEPAY_CALLBACK_PUBLIC_KEY: ${DEPAY_CALLBACK_PUBLIC_KEY:-}
      DEPAY_CHECKOUT_TTL_MINUTES: ${DEPAY_CHECKOUT_TTL_MINUTES:-1440}
      DEPAY_OFFER_AMOUNT_USDC: ${DEPAY_OFFER_AMOUNT_USDC:-30}
      DEPAY_OFFER_CREDITS: ${DEPAY_OFFER_CREDITS:-3000}
      DEPAY_OFFER_UPGRADE_PLAN: ${DEPAY_OFFER_UPGRADE_PLAN:-PRO}
    volumes:
      - media_data:/data/media
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && uvicorn video_platform_api.main:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://video_platform:video_platform_dev@postgres:5432/video_platform
      STORAGE_ROOT: /data/media
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: ai-director-media
      S3_ACCESS_KEY_ID: ai_director
      S3_SECRET_ACCESS_KEY: ai_director_dev_secret
      PUBLIC_BASE_URL: http://api:8080
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Generate and export a Fernet key before starting Compose}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?Generate and export a separate internal service key before starting Compose}
    volumes:
      - media_data:/data/media
    depends_on:
      api:
        condition: service_healthy
    command: ["video-platform-worker"]

volumes:
  postgres_data:
  media_data:
  object_storage_data:

[project]
name = "ai-director-platform"
version = "0.1.0"
description = "State-driven AI director workspace with candidate QA, continuity and provider routing"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "eth-account>=0.13,<1",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
video-platform-api = "video_platform_api.main:run"
video-platform-worker = "generation_gateway.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/video_platform_api",
  "packages/domain/production_domain",
  "packages/database/platform_database",
  "packages/provider-sdk/provider_sdk",
  "packages/shared/platform_shared",
  "packages/contracts/platform_contracts",
  "services/generation-gateway/generation_gateway",
  "services/production-engine/production_engine",
  "services/browser-runtime/browser_runtime",
  "services/media-service/media_service",
  "services/character-evidence/character_evidence",
  "providers/google-flow/google_flow_provider",
  "agents/runtime/agent_runtime",
  "providers/seedance/seedance_provider",
  "providers/veo/veo_provider",
  "providers/grok/grok_provider",
  "providers/omni/omni_provider",
  "providers/kling/kling_provider",
  "providers/runway/runway_provider",
  "providers/openrouter/openrouter_provider",
  "providers/runapi/runapi_provider",
  "providers/wan/wan_provider",
  "providers/deepseek/deepseek_provider",
  "core/narrative/narrative_core",
  "core/narrative-ledger/narrative_ledger_core",
  "core/character/character_core",
  "core/continuity/continuity_core",
  "core/generation-policy/generation_policy_core",
  "core/qa/qa_core",
  "core/cost/cost_core",
  "core/skills/skill_core",
  "core/production/director_production",
  "core/model-registry/model_registry_core",
  "core/adapters/video_adapter_core",
  "core/image-prompt/image_prompt_core",
  "core/asset-registry/asset_registry_core",
  "core/style/style_core",
  "core/memory/memory_core",
  "core/runtime-control/runtime_control_core",
  "core/video-prompt/video_prompt_core",
  "core/evaluation/evaluation_core",
  "core/model-metrics/model_metrics_core",
  "core/provider-budget/provider_budget_core",
  "core/entitlements/entitlement_core",
  "core/payments/payment_core",
  "core/external-evidence/external_evidence_core",
  "core/router-evidence/router_evidence_core",
  "core/creative-director/creative_director_core",
  "core/episode-continuation/episode_continuation_core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_provider: opt-in tests that may contact a paid external provider; requires --run-live-provider and provider live gates",
  "postgres_only: needs genuinely concurrent transactions; skipped on the SQLite half of the matrix",
]
pythonpath = [
  "apps/api", "packages/domain", "packages/database", "packages/provider-sdk",
  "packages/shared", "packages/contracts", "services/generation-gateway",
  "services/production-engine", "services/browser-runtime", "services/media-service",
  "services/character-evidence",
  "providers/google-flow", "providers/seedance", "providers/veo", "providers/grok", "providers/omni",
  "providers/kling", "providers/runway", "providers/openrouter", "providers/runapi", "providers/wan",
  "providers/deepseek", "core/narrative", "core/character", "core/continuity",
  "core/generation-policy", "core/qa", "core/cost", "core/skills", "core/production",
  "core/model-registry", "core/adapters",
  "core/image-prompt",
  "core/asset-registry",
  "core/style",
  "core/memory", "core/narrative-ledger", "core/runtime-control", "core/video-prompt", "core/evaluation",
  "core/model-metrics",
  "core/provider-budget",
  "core/entitlements",
  "core/payments",
  "core/external-evidence",
  "core/router-evidence",
  "core/creative-director",
  "core/episode-continuation",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"apps/api/video_platform_api/main.py" = ["B008"]
"apps/api/video_platform_api/auth.py" = ["B008"]
"apps/api/video_platform_api/runtime_routes.py" = ["B008"]
"apps/api/video_platform_api/admin_routes.py" = ["B008"]
"apps/api/video_platform_api/creative_routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = false
files = [
  "apps/api", "packages/domain", "packages/database", "packages/provider-sdk",
  "packages/shared", "packages/contracts", "services/generation-gateway",
  "services/production-engine", "services/browser-runtime", "services/media-service",
  "providers/google-flow", "providers/seedance", "providers/openrouter", "providers/runapi",
  "providers/wan", "providers/deepseek",
  "agents/runtime",
  "core/narrative", "core/character", "core/continuity", "core/generation-policy",
  "core/qa", "core/cost", "core/skills", "core/production",
  "core/model-registry", "core/adapters",
  "core/image-prompt",
  "core/asset-registry",
  "core/memory", "core/narrative-ledger", "core/runtime-control", "core/video-prompt", "core/evaluation",
  "core/model-metrics",
  "core/provider-budget",
  "core/entitlements",
  "core/payments",
  "core/external-evidence",
  "core/router-evidence",
  "core/creative-director",
  "core/episode-continuation",
]
